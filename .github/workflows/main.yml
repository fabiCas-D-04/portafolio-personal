# ============================================================
# RAMA MAIN -> en cada push:
#   1. Ejecuta los tests automatizados
#   2. Empaqueta el portafolio en Docker y lo sube a DockerHub
#   3. Crea la infraestructura en AWS con Terraform
#      (VPC, subredes, IP pública, EC2 Ubuntu 24.04)
#   4. Configura la VM con Ansible
#      (docker, git, firewall, iptables 80/443) y despliega
#   5. [Extra] Crea el registro DNS del proyecto en Cloudflare
# ============================================================
name: MAIN - Docker, Terraform y Ansible

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # 1) Tests antes de desplegar nada
  # ---------------------------------------------------------
  tests:
    name: Tests automatizados
    uses: ./.github/workflows/tests.yml

  # ---------------------------------------------------------
  # 2) Docker -> DockerHub
  # ---------------------------------------------------------
  docker:
    name: Dockerizar y publicar en DockerHub
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + Push del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + Push del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # 3) Terraform -> VM en AWS (VPC, subredes, IP pública)
  # ---------------------------------------------------------
  terraform:
    name: Infraestructura con Terraform
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    outputs:
      public_ip: ${{ steps.public_ip.outputs.ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -diff

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false tfplan

      - name: Obtener IP pública
        id: public_ip
        run: echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Guardar clave SSH privada
        run: |
          umask 077
          terraform output -raw private_key_pem > /tmp/portfolio-key.pem

      - name: Subir clave SSH como artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssh-key
          path: /tmp/portfolio-key.pem
          retention-days: 1

  # ---------------------------------------------------------
  # 4) Ansible -> configura la VM y despliega el portafolio
  # ---------------------------------------------------------
  deploy:
    name: Configurar VM con Ansible
    needs: [docker, terraform]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      PUBLIC_IP: ${{ needs.terraform.outputs.public_ip }}
    outputs:
      public_ip: ${{ needs.terraform.outputs.public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Descargar clave SSH
        uses: actions/download-artifact@v8
        with:
          name: ssh-key
          path: /tmp/ssh

      - name: Preparar clave SSH
        run: |
          mkdir -p ~/.ssh
          cp /tmp/ssh/portfolio-key.pem ~/.ssh/portfolio-key.pem
          chmod 600 ~/.ssh/portfolio-key.pem

      - name: Configurar Python y Ansible
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Ansible
        run: pip install ansible

      - name: Verificar conexión SSH a la VM
        run: |
          for i in $(seq 1 12); do
            if ssh -i ~/.ssh/portfolio-key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                 ubuntu@"$PUBLIC_IP" 'echo conectado'; then
              exit 0
            fi
            echo "Intento $i fallido, reintentando en 10s..."
            sleep 10
          done
          exit 1

      - name: Generar inventario de Ansible
        run: |
          cat > ansible/inventory.ini <<EOF
          [portfolio]
          ${PUBLIC_IP} ansible_user=ubuntu ansible_ssh_private_key_file=${HOME}/.ssh/portfolio-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

      - name: Ejecutar playbook (docker, git, firewall, iptables 80/443)
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --extra-vars "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" \
            --extra-vars "DOCKERHUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}"
        env:
          ANSIBLE_FORCE_COLOR: "true"

      - name: Comprobar que el portafolio responde en el puerto 80
        run: |
          sleep 15
          curl --retry 5 --retry-delay 10 --retry-connrefused \
            -fsS "http://${PUBLIC_IP}/api/health"

  # ---------------------------------------------------------
  # 5) [Extra 30 pts] Cloudflare -> dominio del proyecto
  # ---------------------------------------------------------
  cloudflare-dns:
    name: Registro DNS en Cloudflare (extra)
    needs: [terraform, deploy]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_DOMAIN: ${{ vars.CLOUDFLARE_DOMAIN }}
      TARGET_IP: ${{ needs.terraform.outputs.public_ip }}
    steps:
      - name: Crear o actualizar el registro A del dominio
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ZONE_ID != '' && env.CLOUDFLARE_DOMAIN != '' }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          RECORD_ID=$(curl -sS -G "$API" \
            -H "$AUTH" \
            --data-urlencode "type=A" \
            --data-urlencode "name=${CLOUDFLARE_DOMAIN}" \
            | jq -r '.result[0].id // empty')

          BODY=$(jq -n \
            --arg name "$CLOUDFLARE_DOMAIN" \
            --arg ip "$TARGET_IP" \
            '{type:"A", name:$name, content:$ip, ttl:1, proxied:true}')

          if [ -n "$RECORD_ID" ]; then
            echo "Actualizando registro existente ${CLOUDFLARE_DOMAIN} -> ${TARGET_IP}"
            curl -sS -X PUT "${API}/${RECORD_ID}" -H "$AUTH" \
              -H "Content-Type: application/json" --data "$BODY" | jq .
          else
            echo "Creando registro ${CLOUDFLARE_DOMAIN} -> ${TARGET_IP}"
            curl -sS -X POST "$API" -H "$AUTH" \
              -H "Content-Type: application/json" --data "$BODY" | jq .
          fi

      - name: Cloudflare omitido (faltan secretos)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ZONE_ID == '' || env.CLOUDFLARE_DOMAIN == '' }}
        run: echo "No se configuró Cloudflare. Configura CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID (secretos) y CLOUDFLARE_DOMAIN (variable) para activar este paso."
