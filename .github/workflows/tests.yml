# ============================================================
# Tests automatizados (reutilizable por DEV y MAIN)
# - Unitarios (Jest / Vitest)
# - Integración (Supertest + MongoDB en memoria)
# - E2E (Playwright)
# ============================================================
name: Tests automatizados

on:
  workflow_call:

jobs:
  backend-tests:
    name: Backend - unitarios + integración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cachear binario de MongoDB en memoria
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-7-${{ runner.os }}

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm run test:unit

      - name: Tests de integración
        run: npm run test:integration

  frontend-tests:
    name: Frontend - unitarios (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm test

      - name: Build de producción (verifica que compila)
        run: npm run build

  e2e-tests:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Cachear binario de MongoDB en memoria
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-7-${{ runner.os }}

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Instalar navegador Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests E2E
        run: npx playwright test

      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
