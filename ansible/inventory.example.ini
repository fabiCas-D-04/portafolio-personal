# Copia este archivo como "inventory.ini" y pon la IP pública
# que devuelve Terraform (terraform output -raw public_ip)
#
#   cp inventory.example.ini inventory.ini
#
# El pipeline de GitHub Actions lo genera automáticamente.

[portfolio]
<IP_PUBLICA> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/portfolio-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'
