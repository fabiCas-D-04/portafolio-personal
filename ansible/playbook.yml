---
# ============================================================
# Configuración de la VM del portafolio (Ubuntu 24.04)
# Instala: Docker + plugins, Git, firewall (UFW) e iptables
# con los puertos 80 y 443 abiertos, y despliega el portafolio.
# ============================================================
- name: Configurar VM del portafolio
  hosts: all
  become: true
  vars:
    allowed_http_ports:
      - 80
      - 443
    deploy_dir: /opt/portfolio
    dockerhub_username: "{{ DOCKERHUB_USERNAME | default('local') }}"
    dockerhub_token: "{{ DOCKERHUB_TOKEN | default('') }}"
    deploy_app: true

  tasks:
    # -------------------- Paquetes base --------------------
    - name: Actualizar caché de apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar paquetes base (git, ufw, iptables, curl...)
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - ufw
          - iptables
          - iptables-persistent
        state: present

    - name: Verificar que git está instalado
      ansible.builtin.command: git --version
      register: git_version
      changed_when: false

    # -------------------- Docker --------------------
    - name: Crear directorio de claves APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Descargar clave GPG oficial de Docker
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
        executable: /bin/bash

    - name: Agregar repositorio oficial de Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Instalar Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Habilitar e iniciar el servicio Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Añadir el usuario ubuntu al grupo docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Iniciar sesión en DockerHub (opcional, si se envía DOCKERHUB_TOKEN)
      ansible.builtin.command: docker login -u {{ dockerhub_username }} --password-stdin
      args:
        stdin: "{{ dockerhub_token }}"
      no_log: true
      when: dockerhub_token | length > 0

    # -------------------- Firewall (UFW) --------------------
    - name: "Configurar UFW (política por defecto: denegar entrantes)"
      ansible.builtin.command: ufw default deny incoming
      changed_when: false

    - name: Permitir tráfico saliente con UFW
      ansible.builtin.command: ufw default allow outgoing
      changed_when: false

    - name: Permitir SSH (22) con UFW
      ansible.builtin.command: ufw allow OpenSSH
      changed_when: false

    - name: "Permitir HTTP (80) y HTTPS (443) con UFW"
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      loop: "{{ allowed_http_ports }}"
      changed_when: false

    - name: Habilitar UFW sin confirmación
      ansible.builtin.command: ufw --force enable
      changed_when: false

    # -------------------- iptables (puertos 80 y 443) --------------------
    - name: "Abrir puerto {{ item }} en iptables (idempotente)"
      ansible.builtin.shell: |
        set -o pipefail
        iptables -C INPUT -p tcp --dport {{ item }} -j ACCEPT 2>/dev/null \
          || iptables -A INPUT -p tcp --dport {{ item }} -j ACCEPT
      args:
        executable: /bin/bash
      loop: "{{ allowed_http_ports }}"
      register: iptables_rules
      changed_when: "'ACCEPT' in iptables_rules.stdout"

    - name: Guardar reglas iptables para que sobrevivan a reinicios
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      args:
        executable: /bin/bash
      changed_when: false

    # -------------------- Despliegue del portafolio --------------------
    - name: Crear directorio de despliegue
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copiar docker-compose.yml al servidor
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ deploy_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      when: deploy_app | bool

    - name: Crear archivo .env con el usuario de DockerHub
      ansible.builtin.copy:
        dest: "{{ deploy_dir }}/.env"
        content: "DOCKERHUB_USERNAME={{ dockerhub_username }}\n"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      when: deploy_app | bool

    - name: Descargar las imágenes del portafolio desde DockerHub
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ deploy_dir }}"
      become_user: ubuntu
      when: deploy_app | bool

    - name: Levantar el stack (mongo + backend + frontend)
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ deploy_dir }}"
      become_user: ubuntu
      when: deploy_app | bool

  handlers:
    - name: Reiniciar Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
